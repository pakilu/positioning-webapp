services:
  postgres-dev:
    container_name: positioning-db
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=positioning
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=positioning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
